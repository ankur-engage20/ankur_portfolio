server {
    listen 80;
    server_name _;   # domain ho to yahan likho, e.g. ankur.example.com

    location = /favicon.ico { access_log off; log_not_found off; }

    location /static/ {
        alias /home/ubuntu/ankur_portfolio/staticfiles/;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/gunicorn.sock;
    }
}
