<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks — CRUD Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f8;
      color: #22272e;
      line-height: 1.6;
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }

    header {
      background: linear-gradient(135deg, #1f6feb, #0d3b7a);
      color: #fff;
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 24px;
    }
    header h1 { font-size: 1.8rem; }
    header p { opacity: .85; margin-top: 6px; }
    header a { color: #fff; font-size: .9rem; }

    section {
      background: #fff;
      border: 1px solid #e2e6ea;
      border-radius: 12px;
      padding: 22px 24px;
      margin-bottom: 18px;
    }
    section h2 {
      font-size: 1.15rem;
      color: #0d3b7a;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #eef1f4;
    }

    form { display: grid; gap: 10px; }
    input[type="text"], textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      font: inherit;
    }
    textarea { resize: vertical; min-height: 60px; }
    input:focus, textarea:focus { outline: 2px solid #1f6feb; border-color: transparent; }

    button {
      font: inherit;
      font-size: .875rem;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid #d0d7de;
      background: #fff;
      cursor: pointer;
    }
    button:hover { background: #f4f6f8; }
    button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; justify-self: start; }
    button.primary:hover { background: #1a5fd0; }
    button.danger { color: #cf222e; }
    button.danger:hover { background: #ffebe9; }

    .task { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px dashed #e8ebee; }
    .task:last-child { border-bottom: none; padding-bottom: 0; }
    .task input[type="checkbox"] { margin-top: 6px; width: 18px; height: 18px; cursor: pointer; }
    .task .body { flex: 1; min-width: 0; }
    .task h3 { font-size: 1rem; word-break: break-word; }
    .task.done h3 { text-decoration: line-through; color: #8892a0; }
    .task p { color: #57606a; font-size: .92rem; word-break: break-word; }
    .task .meta { font-size: .78rem; color: #8892a0; }
    .task .actions { display: flex; gap: 6px; flex-shrink: 0; }
    .task .edit-form { display: grid; gap: 8px; }
    .task .edit-form .row { display: flex; gap: 6px; }

    .empty { color: #8892a0; text-align: center; padding: 12px 0; }
    .status { min-height: 1.4em; font-size: .88rem; margin-top: 8px; }
    .status.error { color: #cf222e; }
    .status.ok { color: #1a7f37; }

    pre {
      background: #0d1117;
      color: #e6edf3;
      padding: 14px;
      border-radius: 8px;
      font-size: .8rem;
      overflow-x: auto;
    }

    @media (max-width: 560px) {
      .task { flex-wrap: wrap; }
      .task .actions { width: 100%; padding-left: 30px; }
    }

    footer { text-align: center; color: #8892a0; font-size: .82rem; margin-top: 28px; }
  </style>
</head>
<body>
  <div class="wrap">

    <header>
      <h1>📝 Tasks</h1>
      <p>Django CRUD API ka demo — ye page <code>/api/tasks/</code> ko call karta hai.</p>
      <p><a href="{% url 'portfolio:index' %}">← Portfolio par wapas</a></p>
    </header>

    <section>
      <h2>Naya Task (Create)</h2>
      <form id="create-form">
        <input type="text" id="title" placeholder="Task ka title *" maxlength="200" required>
        <textarea id="description" placeholder="Description (optional)"></textarea>
        <button type="submit" class="primary">+ Add Task</button>
      </form>
      <div id="status" class="status"></div>
    </section>

    <section>
      <h2>Saare Tasks (Read / Update / Delete) <span id="count"></span></h2>
      <div id="task-list"><div class="empty">Loading...</div></div>
    </section>

    <section>
      <h2>API khud test karo (curl)</h2>
      <pre id="curl-help"></pre>
    </section>

    <footer>Plain Django + JavaScript fetch() — koi framework nahi.</footer>

  </div>

  <script>
    const API = "/api/tasks/";
    const listEl = document.getElementById("task-list");
    const countEl = document.getElementById("count");
    const statusEl = document.getElementById("status");

    function showStatus(message, type) {
      statusEl.textContent = message;
      statusEl.className = "status " + (type || "");
      if (type === "ok") setTimeout(() => { statusEl.textContent = ""; }, 2500);
    }

    async function request(url, method, body) {
      const options = { method: method || "GET", headers: {} };
      if (body !== undefined) {
        options.headers["Content-Type"] = "application/json";
        options.body = JSON.stringify(body);
      }
      const response = await fetch(url, options);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "Request fail hui (" + response.status + ")");
      return data;
    }

    // Helper: element banao (textContent use karte hain taaki user ka text HTML na ban jaye)
    function el(tag, props, children) {
      const node = document.createElement(tag);
      Object.assign(node, props || {});
      (children || []).forEach((child) => node.append(child));
      return node;
    }

    function renderTask(task) {
      const row = el("div", { className: "task" + (task.done ? " done" : "") });

      const checkbox = el("input", { type: "checkbox", checked: task.done, title: "Done mark karo" });
      checkbox.addEventListener("change", () => updateTask(task.id, { done: checkbox.checked }));

      const body = el("div", { className: "body" }, [
        el("h3", { textContent: task.title }),
        ...(task.description ? [el("p", { textContent: task.description })] : []),
        el("div", { className: "meta", textContent: "#" + task.id + " · " + new Date(task.created_at).toLocaleString() }),
      ]);

      const editBtn = el("button", { type: "button", textContent: "Edit" });
      editBtn.addEventListener("click", () => showEditForm(row, body, actions, task));

      const deleteBtn = el("button", { type: "button", className: "danger", textContent: "Delete" });
      deleteBtn.addEventListener("click", () => deleteTask(task));

      const actions = el("div", { className: "actions" }, [editBtn, deleteBtn]);

      row.append(checkbox, body, actions);
      return row;
    }

    function showEditForm(row, body, actions, task) {
      const titleInput = el("input", { type: "text", value: task.title, maxLength: 200 });
      const descInput = el("textarea", { value: task.description });
      const saveBtn = el("button", { type: "submit", className: "primary", textContent: "Save" });
      const cancelBtn = el("button", { type: "button", textContent: "Cancel" });

      const form = el("form", { className: "edit-form" }, [
        titleInput, descInput, el("div", { className: "row" }, [saveBtn, cancelBtn]),
      ]);
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        updateTask(task.id, { title: titleInput.value, description: descInput.value });
      });
      cancelBtn.addEventListener("click", loadTasks);

      body.replaceWith(el("div", { className: "body" }, [form]));
      actions.remove();
      titleInput.focus();
    }

    // READ
    async function loadTasks() {
      try {
        const data = await request(API);
        countEl.textContent = "(" + data.count + ")";
        listEl.replaceChildren();
        if (data.count === 0) {
          listEl.append(el("div", { className: "empty", textContent: "Abhi koi task nahi hai. Upar se add karo 👆" }));
          return;
        }
        data.results.forEach((task) => listEl.append(renderTask(task)));
      } catch (err) {
        listEl.replaceChildren(el("div", { className: "empty", textContent: "⚠️ " + err.message }));
      }
    }

    // CREATE
    document.getElementById("create-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const titleEl = document.getElementById("title");
      const descEl = document.getElementById("description");
      try {
        await request(API, "POST", { title: titleEl.value, description: descEl.value });
        titleEl.value = "";
        descEl.value = "";
        showStatus("✅ Task add ho gaya", "ok");
        loadTasks();
      } catch (err) {
        showStatus("⚠️ " + err.message, "error");
      }
    });

    // UPDATE
    async function updateTask(id, changes) {
      try {
        await request(API + id + "/", "PUT", changes);
        showStatus("✅ Task update ho gaya", "ok");
      } catch (err) {
        showStatus("⚠️ " + err.message, "error");
      }
      loadTasks();
    }

    // DELETE
    async function deleteTask(task) {
      if (!confirm('"' + task.title + '" delete karna hai?')) return;
      try {
        await request(API + task.id + "/", "DELETE");
        showStatus("🗑️ Task delete ho gaya", "ok");
      } catch (err) {
        showStatus("⚠️ " + err.message, "error");
      }
      loadTasks();
    }

    const base = window.location.origin + API;
    document.getElementById("curl-help").textContent = [
      "# Saare tasks (READ)",
      "curl " + base,
      "",
      "# Naya task (CREATE)",
      "curl -X POST " + base + " -H 'Content-Type: application/json' -d '{\"title\": \"Docker seekhna\"}'",
      "",
      "# Ek task (READ one)",
      "curl " + base + "1/",
      "",
      "# Update (UPDATE)",
      "curl -X PUT " + base + "1/ -H 'Content-Type: application/json' -d '{\"done\": true}'",
      "",
      "# Delete (DELETE)",
      "curl -X DELETE " + base + "1/",
    ].join("\n");

    loadTasks();
  </script>
</body>
</html>
